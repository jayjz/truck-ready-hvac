[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "truck-ready-hvac"
version = "0.2.0"
description = "Pre-departure parts checklist for HVAC technicians. Stage the right parts, export offline JSON/PDF, finish more jobs first visit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Justin Coulam", email = "coulamjustin3@gmail.com" },
]
keywords = ["hvac", "parts", "checklist", "field-service", "technician", "inventory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "pydantic>=2.7",
    "streamlit>=1.35",
    "fpdf2>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/jayjz/truck-ready-hvac"
Repository = "https://github.com/jayjz/truck-ready-hvac"
Issues = "https://github.com/jayjz/truck-ready-hvac/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/truck_ready"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["truck_ready"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["truck_ready"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["streamlit.*", "fpdf.*"]
ignore_missing_imports = true
